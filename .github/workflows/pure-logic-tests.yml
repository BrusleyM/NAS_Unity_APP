# kind: ci
name: Unity pure-logic tests

# Unity builds and the full Test Runner need a Unity licence and (for iOS) a Mac with signing - those
# stay manual. What can be checked on every push without either: the engine-free logic (screen-visit
# timing, environment selection) and its tests, compiled and run with plain `dotnet test`.
on:
  push:
    branches: [ main, develop ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unity-logic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pure-logic:
    name: Engine-free logic and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test CI/PureLogicTests --nologo

  # The same check that used to be a separate "Workflow rules" workflow: every file in .github/workflows must follow
  # NAS_Backend/docs/WORKFLOW_RULES.md. A few seconds, so it just runs with the rest of CI.
  workflow-rules:
    name: Check the workflow files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install pyyaml
      - name: The checker itself still catches what it should
        run: python .github/scripts/check_workflows.py --self-test
      - name: Check this repo's workflows
        run: python .github/scripts/check_workflows.py
